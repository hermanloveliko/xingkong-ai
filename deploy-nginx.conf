# ══════════════════════════════════════════════════════════════════════════════
# 星空AI · Nginx 生产配置
#
# 使用方法：
#   1. 将本文件上传到服务器
#   2. 将 "你的域名.com" 全部替换为真实域名
#   3. 将 SSL 证书路径替换为真实路径
#   4. 执行：
#        sudo cp deploy-nginx.conf /etc/nginx/sites-available/nebula
#        sudo ln -s /etc/nginx/sites-available/nebula /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS 强制跳转 ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 你的域名.com www.你的域名.com;

    # 验证 Let's Encrypt / 阿里云证书用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求强制跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主站 ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 你的域名.com www.你的域名.com;

    # ── SSL 证书（阿里云下载的 Nginx 格式）────────────────────────────────────
    # 上传到服务器路径：/etc/ssl/nebula/
    ssl_certificate     /etc/ssl/nebula/你的域名.pem;
    ssl_certificate_key /etc/ssl/nebula/你的域名.key;

    # SSL 安全配置
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全 Header ───────────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 上传文件大小限制 ──────────────────────────────────────────────────────
    client_max_body_size 20M;

    # ── 桌面端 .exe 下载 ──────────────────────────────────────────────────────
    location /downloads/ {
        alias /var/www/nebula/downloads/;
        # 强制下载（不在浏览器内打开）
        add_header Content-Disposition 'attachment';
        # 允许断点续传
        add_header Accept-Ranges bytes;
    }

    # ── API 请求 → Node.js ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── 前端静态页面（由 Node.js 服务）──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 日志 ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/nebula_access.log;
    error_log  /var/log/nginx/nebula_error.log;
}

